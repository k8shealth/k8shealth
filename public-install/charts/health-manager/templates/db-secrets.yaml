{{- /*
Quick-start database + admin secrets. Rendered ONLY when the bundled MySQL or an external database
is configured through this chart, so existing installs (which pass DB settings via envFrom/extraEnv)
are completely unaffected.
Passwords are generated once and re-used on `helm upgrade` through `lookup`.
*/ -}}
{{- $fullname := include "helm-chart.fullname" . }}
{{- if or .Values.mysql.enabled (and .Values.externalDatabase.url (not .Values.externalDatabase.existingSecret)) }}
{{- $name := printf "%s-db" $fullname }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $appPwd := randAlphaNum 24 }}
{{- $rootPwd := randAlphaNum 24 }}
{{- if $existing }}
  {{- $appPwd = index $existing.data "app-password" | b64dec }}
  {{- if hasKey $existing.data "root-password" }}{{- $rootPwd = index $existing.data "root-password" | b64dec }}{{- end }}
{{- end }}
{{- if and (not .Values.mysql.enabled) .Values.externalDatabase.password }}
  {{- $appPwd = .Values.externalDatabase.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  app-password: {{ $appPwd | b64enc | quote }}
  {{- if .Values.mysql.enabled }}
  root-password: {{ $rootPwd | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if and (or .Values.mysql.enabled .Values.externalDatabase.url) (not .Values.admin.existingSecret) }}
---
{{- $aname := printf "%s-admin" $fullname }}
{{- $aexisting := lookup "v1" "Secret" .Release.Namespace $aname }}
{{- $adminPwd := randAlphaNum 20 }}
{{- if $aexisting }}{{- $adminPwd = index $aexisting.data "password" | b64dec }}{{- end }}
{{- if .Values.admin.password }}{{- $adminPwd = .Values.admin.password }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $aname }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $adminPwd | b64enc | quote }}
{{- end }}

{{- /*
Signing / encryption keys of the manager (MFA secrets, remember-me cookies, stored registry credentials).
Without them the manager falls back to a public default key, so remember-me cookies could be forged.
Generated once on install and kept on upgrade. An install that predates this secret (it runs on the default key and
may already hold MFA enrolments encrypted with it) is left untouched: changing the key would invalidate them.
*/ -}}
{{- if or .Values.mysql.enabled .Values.externalDatabase.url }}
{{- $sname := printf "%s-security" $fullname }}
{{- $sexisting := lookup "v1" "Secret" .Release.Namespace $sname }}
{{- if or $sexisting .Release.IsInstall }}
{{- $mfaKey := randAlphaNum 48 }}
{{- $rememberKey := randAlphaNum 48 }}
{{- if $sexisting }}
  {{- $mfaKey = index $sexisting.data "mfa-key" | b64dec }}
  {{- $rememberKey = index $sexisting.data "remember-me-key" | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sname }}
  labels:
    {{- include "helm-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  mfa-key: {{ $mfaKey | b64enc | quote }}
  remember-me-key: {{ $rememberKey | b64enc | quote }}
{{- end }}
{{- end }}
