{{- /*
  Installing Kyverno over a Kyverno somebody else installed breaks both. Say so in plain words instead of showing a Helm
  ownership error. lookup is empty while rendering offline (helm template, --dry-run), so this only acts on a real install.
*/ -}}
{{- if .Values.kyverno.install }}
{{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "clusterpolicies.kyverno.io" }}
{{- if $crd }}
{{- $owner := dig "metadata" "annotations" "meta.helm.sh/release-name" "" $crd }}
{{- if ne $owner .Release.Name }}
{{- fail "Kyverno is already installed on this cluster. Run the same command again with --set kyverno.install=false added: only the agent injection policy is installed, and your Kyverno is left as it is." }}
{{- end }}
{{- end }}
{{- end }}
