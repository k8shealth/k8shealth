healthAgentSidecar:
  # Full image reference injected into labelled pods.
  image: ghcr.io/k8shealth/health-agent:1.0.336
  # Label / annotation prefix: pods labelled <domain>/enabled=enabled get the agent. The manager reports this
  # value to the UI, so the onboarding command always matches the installed policy.
  domain: k8shealth.io
  # Where injected agents report when a pod has no <domain>/health-agent-manager-url annotation.
  managerUrl: http://health-manager.k8shealth.svc:8080
  # Namespace holding the health-agent-health-script ConfigMap (cloned into workload namespaces on demand).
  # Empty = the namespace this chart is installed into, so it never depends on a namespace that may not exist yet.
  scriptNamespace: ""

# Never block pod creation when Kyverno is briefly unavailable (the policy only mutates).
kyverno:
  # false = Kyverno is already on the cluster (install.sh detects this); only the policy is installed.
  install: true
  features:
    forceFailurePolicyIgnore:
      enabled: true
  # The hook image defaults to a moving tag; pin it to the engine version.
  webhooksCleanup:
    image: {tag: 'v1.19.2'}

# One-install mode (the portal wizard command): the policy is applied by a Job after Kyverno is up, and the agent script
# ConfigMap is created by this chart. install.sh turns both off because it applies them itself.
policyAsHook: true
agentScript:
  install: true
policyInstaller:
  image: registry.k8s.io/kubectl:v1.31.4
